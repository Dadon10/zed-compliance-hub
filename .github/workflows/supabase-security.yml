name: Supabase Security Lint

# Blocks merges to main if the Supabase linter reports new SECURITY DEFINER
# or RLS misconfiguration findings. Runs on pull requests targeting main and
# on direct pushes to main as a safety net.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN  - personal access token for the Supabase CLI
#   SUPABASE_PROJECT_REF   - the project ref to lint (e.g. ksppwtmduhumwvjgoiar)
#
# Optional: maintain an allow-list of accepted finding "name" values in
# .github/supabase-lint-allowlist.txt (one per line, comments with #).
# Anything not on the allow-list that matches the blocking categories below
# will fail the job.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  supabase-security-lint:
    name: Block on SECURITY DEFINER / RLS misconfig findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase linter
        id: lint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set as repo secrets."
            exit 1
          fi
          supabase db lint \
            --linked \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --level warn \
            --output json > lint.json
          echo "--- Raw linter output ---"
          cat lint.json

      - name: Fail on blocking findings
        run: |
          set -euo pipefail
          node .github/scripts/check-supabase-lint.mjs lint.json
